name: Paket 119 endpoint smoke

on:
  push:
    branches: [main]
    paths:
      - 'paket-119-tests/**'
      - '.github/workflows/paket-119-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Probe carrier endpoints with fake tracking numbers
        run: node paket-119-tests/smoke.mjs
