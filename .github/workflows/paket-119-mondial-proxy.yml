name: Paket 119 Mondial proxy

on:
  push:
    branches: [main]
    paths:
      - 'paket-119-tests/mondial-proxy.mjs'
      - '.github/workflows/paket-119-mondial-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node paket-119-tests/mondial-proxy.mjs
