name: Paket 119 inspect extcall internals

on:
  push:
    branches: [main]
    paths:
      - 'paket-119-tests/extcall-internals.mjs'
      - '.github/workflows/paket-119-extcall-internals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node paket-119-tests/extcall-internals.mjs
