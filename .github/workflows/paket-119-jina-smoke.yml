name: Paket 119 jina smoke

on:
  push:
    branches: [main]
    paths:
      - 'paket-119-tests/jina-smoke.mjs'
      - '.github/workflows/paket-119-jina-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node paket-119-tests/jina-smoke.mjs
